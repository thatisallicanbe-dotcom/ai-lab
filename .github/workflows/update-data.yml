name: 공공데이터 수집

on:
  schedule:
    - cron: "17 18 * * *"   # 매일 한국시간 03:17
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["scripts/fetch_data.py", ".github/workflows/update-data.yml"]

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 공공데이터 받아오기
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: python scripts/fetch_data.py

      - name: 데이터 저장 후 사이트(gh-pages)에 반영
        if: always()
        run: |
          git config user.name "gangwon-gyeote-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "바뀐 데이터 없음"
          else
            git commit -m "데이터 갱신 $(TZ=Asia/Seoul date +'%Y-%m-%d %H:%M')"
            git push origin HEAD:main
          fi
          git push --force origin HEAD:gh-pages
