<!DOCTYPE html>
<html lang="ko" data-size="1">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>강원 곁에 — 생활정보 안내</title>
  <meta name="description" content="강원 주민을 위한 쉬운 생활정보 안내: 지원제도, 가까운 병원·공중화장실, 가족 안부 공유">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <a href="#/" class="brand" aria-label="처음으로">강원 곁에</a>
    <div class="size-switch" role="group" aria-label="글씨 크기">
      <button data-size="1" aria-label="보통 글씨">가</button>
      <button data-size="2" aria-label="큰 글씨">가</button>
      <button data-size="3" aria-label="아주 큰 글씨">가</button>
    </div>
  </header>

  <main id="app" tabindex="-1"></main>

  <footer class="foot">
    시제품(데모) — 지원제도·시설 정보는 샘플이며, 정확한 내용은 표시된 공식 출처에서 확인하세요.
  </footer>

  <div id="toast" role="status" aria-live="polite"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
